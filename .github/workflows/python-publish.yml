# Upload Python Package on GitHub Release published
# - Injects the tag version into pyproject.toml before building
# - Builds once
# - Uploads dists as a workflow artifact and as release assets
# - Publishes to PyPI in a dependent job
on:
  release:
    types: [published]

name: Upload Python Package

# Grant write permission to repo contents so we can attach assets to the release.
permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (fetch tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug git/tag info
        run: |
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          git rev-parse --verify HEAD
          git show -s --format='%H %an %ar' HEAD
          git tag --points-at HEAD || true
          echo "pyproject before any change:"
          sed -n '1,200p' pyproject.toml || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract version from release tag
        id: get_version
        run: |
          # Remove a leading "v" if present
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Inject version into pyproject.toml
        run: |
          # Replace the version line with the release tag's version (keeps quoting correct)
          sed -i "s/^version = .*/version = \"${{ steps.get_version.outputs.version }}\"/" pyproject.toml || true
          echo "pyproject after injection:"
          grep '^version' pyproject.toml || true

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build release distributions
        run: |
          python -m build

      - name: Inspect built artifacts
        run: |
          echo "Artifacts:"
          ls -l dist || true
          echo "Wheel/metadata:"
          unzip -p dist/*.whl */METADATA | grep -E '^Name:|^Version:' || true

      - name: Upload workflow artifact (release dists)
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Attach dists to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
        env:
          # Ensure you have PYPI_API_TOKEN configured in repository secrets
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
